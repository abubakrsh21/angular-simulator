<header class="header">
    <div class="container header-container">
        <div class="logo-wrapper">
            <img src="/images/logo-icon.svg" alt="Logo">
            <span class="company-name">{{ companyName }}</span>
        </div>

        <nav class="nav-wrapper">
            <a>Главная</a>
            <a>Про гида</a>
            <a>Программа тура</a>
            <a>Стоимость</a>
            <a>Блог</a>
            <a>Контакты</a>
        </nav>

        <button class="header-button">Консультация</button>
    </div>
</header>

<section class="main">
    <div class="banner"></div>
    <div class="main-info container">
        <h2>
            Насладись прогулкой в горах <br>
            с командой единомышленников
        </h2>
        <div class="search-program">
            <div class="select">
                <select name="location" id="select-location">
                    <option value="">Локация для тура</option>
                </select>
                <label for="">выберите из списка</label>
            </div>

            <div class="select">
                <select name="date" id="select-date">
                    <option value="">Дата похода</option>
                </select>
                <label for="">укажите дату</label>
            </div>

            <div class="select">
                <select name="participants" id="select-participants">
                    <option value="">Участники</option>
                </select>
                <label for="">выберите из списка</label>
            </div>
            <button class="search-program-button">Найти программу</button>
        </div>
    </div>

</section>
