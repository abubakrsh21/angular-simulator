<header class="header">
    <div class="container header-container">
        <div class="logo-wrapper">
            <img src="/images/logo-icon.svg" alt="Logo">
            <span class="company-name">{{ companyName }}</span>
        </div>

        <nav class="nav-wrapper">
            @for (item of navigation; track item.link) {
                <a [routerLink]="item.link" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                    {{ item.title }}
                </a>
            }
        </nav>

        <div class="header-actions">
            <button class="header-button">Консультация</button>
            <button class="header-toggle" type="button" (click)="isClockVisible = !isClockVisible">
                {{ isClockVisible ? 'Показать счётчик' : 'Показать таймер' }}
            </button>
            <div class="header-widget">
                @if (isClockVisible) {
                    <div class="header-clock">
                        {{ currentDateTime | date: 'dd.MM.yyyy HH:mm:ss' }}
                    </div>
                }

                <div class="header-counter" *ngIf="!isClockVisible">
                    <button class="header-counter__button" type="button" (click)="decrementClickCount()"
                        [disabled]="clickCount === 0">-</button>
                    <span class="header-counter__value">{{ clickCount }}</span>
                    <button class="header-counter__button" type="button" (click)="incrementClickCount()">+</button>
                </div>
            </div>
        </div>
    </div>
</header>
